services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cascadetrace
      POSTGRES_USER: cascadetrace
      POSTGRES_PASSWORD: cascadetrace
    ports:
      - "5432:5432"
    volumes:
      - cascadetrace-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cascadetrace -d cascadetrace"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/cascadetrace
      DATABASE_USERNAME: cascadetrace
      DATABASE_PASSWORD: cascadetrace
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cascadetrace-postgres:
