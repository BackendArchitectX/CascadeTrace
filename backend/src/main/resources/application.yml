spring:
  application:
    name: cascadetrace-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cascadetrace}
    username: ${DATABASE_USERNAME:cascadetrace}
    password: ${DATABASE_PASSWORD:cascadetrace}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
server:
  port: ${PORT:8080}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-none}]"
